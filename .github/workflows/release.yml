name: Build and publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x64}
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: macos-15, target: macos-arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux Tk runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Syntax and core tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build native app
        run: python scripts/build.py
      - name: Package native app
        run: python scripts/package.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --title "觅文 SeekWords ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md --verify-tag
